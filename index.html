<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f5">
<meta name="description" content="Lockmark — a compact bookmark manager with E2EE local-first sync and backup support.">
<meta name="application-name" content="Lockmark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<body>
<section class="bar" id="bar" aria-label="Bookmarks toolbar">
  <div class="row" id="r1"></div>
  <div class="row" id="r2"></div>
</section>
<div class="popup" id="popup"></div>
<div class="ctx" id="ctx"></div>
<div class="bg" id="bg"><section class="modal" id="modal"></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="app-status" role="button" tabindex="0" title="Click to open Sync & Backup Settings" style="position:fixed;right:8px;bottom:8px;z-index:4;font:11px Arial,sans-serif;color:#756b68;background:#fffdfa;border:1px solid #eaded8;border-radius:99px;padding:4px 8px;opacity:.92;cursor:pointer">Lockmark · Local</div>

<script>
const appStatus = { sync: "Local", offline: false };
function renderAppStatus() {
  const el = document.getElementById("app-status");
  if (el) el.textContent = "Lockmark · " + appStatus.sync + (appStatus.offline ? " · Offline ✓" : "");
}
function setSyncStatus(text) { appStatus.sync = text; renderAppStatus(); }

const PREFS_KEY = "lockmark.prefs";
const prefs = (() => {
  try { return { externalFavicons: true, ...JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") }; }
  catch { return { externalFavicons: true }; }
})();
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }

function stripLegacyIcons(items) {
  let changed = false;
  (items || []).forEach(x => {
    if (x && typeof x.iconUrl === "string" && x.iconUrl.trim() !== "") {
      if (!x.iconUrl.startsWith("data:")) {
        delete x.iconUrl; delete x.iconAuto; changed = true;
      }
    }
  });
  return changed;
}

class BookmarkRepository {
  constructor(storageKey = "lockmark.data") {
    this.storageKey = storageKey;
  }

  load() {
    try {
      let raw = localStorage.getItem(this.storageKey);
      if (raw) {
        let data = JSON.parse(raw);
        let items = data.items || data;
        if (stripLegacyIcons(items)) {
          this.save(items);
        }
        if (items.length > 0 && !items.some(x => x.bar)) {
          items.forEach(x => { if (!x.parent) x.bar = true; });
        }
        return { version: data.version || 1, items };
      }

      const oldKeys = ["lockmark.compact.v7.data", "lockmark.compact.v6.data"];
      let oldRaw = null;
      for (let key of oldKeys) {
        oldRaw = localStorage.getItem(key);
        if (oldRaw) break;
      }

      if (oldRaw) {
        let oldData = JSON.parse(oldRaw);
        let items = oldData.items || oldData;
        stripLegacyIcons(items);
        if (items.length > 0 && !items.some(x => x.bar)) {
          items.forEach(x => { if (!x.parent) x.bar = true; });
        }
        this.save(items);
        return { version: 1, items };
      }

      return { version: 1, items: [] };
    } catch (e) {
      console.error("Load error:", e);
      return { version: 1, items: [] };
    }
  }

  save(items) {
    stripLegacyIcons(items);
    let payload = {
      version: 1,
      updatedAt: Date.now(),
      items: items
    };
    localStorage.setItem(this.storageKey, JSON.stringify(payload));
  }
}

class BookmarkManager {
  constructor(repo) {
    this.repo = repo;
    let stored = this.repo.load();
    this.version = stored.version;
    this.items = stored.items;
    this._batchDepth = 0;
    this._dirty = false;
  }

  persist() {
    if (this._batchDepth > 0) { this._dirty = true; return; }
    this.repo.save(this.items);
    if (window.lockmarkSync) window.lockmarkSync.localChanged(this.items);
  }

  batch(fn) {
    this._batchDepth++;
    try { return fn(); }
    finally {
      this._batchDepth--;
      if (this._batchDepth === 0 && this._dirty) { this._dirty = false; this.persist(); }
    }
  }

  nextOrder() {
    return this.items.reduce((m, x) => Math.max(m, Number(x.order) || 0), 0) + 1;
  }

  getKids(parentId = "") {
    return this.items.filter(x => (x.parent || "") === (parentId || ""));
  }

  findById(id) {
    return this.items.find(x => x.id === id);
  }

  add(itemData) {
    const now = Date.now();
    const newItem = {
      id: crypto.randomUUID(),
      createdAt: now,
      updatedAt: now,
      order: Math.max(now, this.nextOrder()),
      ...itemData
    };
    this.items.push(newItem);
    this.persist();
    return newItem;
  }

  update(id, itemData) {
    let item = this.findById(id);
    if (!item) return;
    Object.assign(item, itemData, { updatedAt: Date.now() });
    this.persist();
  }

  remove(id) {
    let target = this.findById(id);
    if (!target) return;
    this.items.forEach(y => { if (y.parent === id) y.parent = target.parent || ""; });
    this.items = this.items.filter(y => y.id !== id);
    this.persist();
  }

  exportData() {
    stripLegacyIcons(this.items);
    return JSON.stringify({ version: this.version, updatedAt: Date.now(), items: this.items }, null, 2);
  }

  importData(incomingItems) {
    let now = Date.now();
    let remap = new Map();
    incomingItems.filter(x => x.type === "folder").forEach(x => remap.set(x.id, crypto.randomUUID()));
    
    stripLegacyIcons(incomingItems);

    const base = this.nextOrder();
    incomingItems
      .map((x, i) => ({ x, i }))
      .sort((a, b) => ((Number(a.x.order) || a.i) - (Number(b.x.order) || b.i)) || (a.i - b.i))
      .forEach(({ x }, k) => { x.order = base + k; });

    incomingItems.forEach(x => {
      let oldId = x.id;
      let isF = x.type === "folder";
      x.id = isF ? (remap.get(oldId) || crypto.randomUUID()) : crypto.randomUUID();
      x.parent = x.parent ? (remap.get(x.parent) || "") : "";
      x.bar = !x.parent && !!x.bar;
      x.createdAt = x.createdAt || now;
      x.updatedAt = now;
      this.items.push(x);
    });
    this.persist();
  }
}

function pinSig(x) {
  return [x.title, x.type, x.url, x.glyph || "", x.iconUrl || "", x.iconAuto ? 1 : 0, prefs.externalFavicons ? 1 : 0].join("\u0001");
}

class ToolbarUI {
  constructor(manager) {
    this.manager = manager;
    this.openId = null;
    this._cachedWidths = new Map();
    this._overflowEl = null;
    this._overflowIds = [];
  }

  render() {
    const bar = document.getElementById("bar");
    const pins = this.manager.items.filter(x => x.bar && !x.parent).sort((a, b) => (a.order || 0) - (b.order || 0));
    const rows = [document.getElementById("r1"), document.getElementById("r2")];
    const available = bar.clientWidth - 12;
    const sigs = new Map(pins.map(x => [x.id, pinSig(x)]));

    if (this._cachedWidths.size > pins.length * 3 + 50) this._cachedWidths.clear();

    const missing = pins.filter(x => !this._cachedWidths.has(sigs.get(x.id)));
    if (missing.length > 0) {
      const probe = document.createElement("div");
      probe.style.cssText = "position:fixed;left:-10000px;top:0;display:flex;gap:2px;white-space:nowrap;visibility:hidden;font:13px Arial,sans-serif";
      const els = missing.map(x => {
        const a = document.createElement("a");
        a.className = "pin" + (isF(x) ? " folder" : "");
        a.innerHTML = `<span class="glyph">${iconMarkup(x)}</span><span class="label">${esc(x.title)}${isF(x) ? " ▾" : ""}</span>`;
        probe.append(a);
        return a;
      });
      document.body.append(probe);
      missing.forEach((x, i) => this._cachedWidths.set(sigs.get(x.id), els[i].getBoundingClientRect().width + 2));
      probe.remove();
    }

    const widths = pins.map(x => this._cachedWidths.get(sigs.get(x.id)) || 100);

    let chosen = [[], []], used = [0, 0], overflow = [], row = 0;
    pins.forEach((x, i) => {
      let w = widths[i];
      if (row === 0 && used[0] + w <= available) { chosen[0].push(x); used[0] += w; }
      else { row = 1; if (used[1] + w <= available - (pins.length > i + 1 ? 34 : 0)) { chosen[1].push(x); used[1] += w; } else overflow.push(x); }
    });
    if (overflow.length) {
      while (chosen[1].length && used[1] + 34 > available) {
        let x = chosen[1].pop(); let idx = pins.indexOf(x); used[1] -= widths[idx]; overflow.unshift(x);
      }
    }

    const existing = new Map();
    rows.forEach(r => r.querySelectorAll(".pin[data-id]").forEach(el => existing.set(el.dataset.id, el)));

    this._overflowIds = overflow.map(x => x.id);

    rows.forEach((r, i) => {
      const nodes = chosen[i].map(x => {
        const sig = sigs.get(x.id);
        const el = existing.get(x.id);
        return (el && el.dataset.sig === sig) ? el : this.createPinElement(x, sig);
      });
      if (i === 1 && overflow.length) nodes.push(this.getOverflowEl());
      const current = [...r.children];
      if (current.length !== nodes.length || current.some((n, k) => n !== nodes[k])) r.replaceChildren(...nodes);
    });
  }

  getOverflowEl() {
    if (!this._overflowEl) {
      const el = document.createElement("a");
      el.href = "#";
      el.className = "pin overflowpin";
      el.style.flex = "0 0 auto";
      el.innerHTML = '<span class="label">≫</span>';
      el.title = "More bookmarks";
      el.onclick = e => { e.preventDefault(); this.toggleOverflow(el, this._overflowIds); };
      this._overflowEl = el;
    }
    return this._overflowEl;
  }

  createPinElement(x, sig = pinSig(x)) {
    let a = document.createElement("a");
    a.className = "pin" + (isF(x) ? " folder" : "");
    a.href = isF(x) ? "#" : x.url; a.draggable = true; a.dataset.id = x.id; a.dataset.sig = sig;
    a.innerHTML = `<span class="glyph">${iconMarkup(x)}</span><span class="label">${esc(x.title)}${isF(x)?" ▾":""}</span><span class="pin-edit" role="button" tabindex="0" title="Edit item" aria-label="Edit ${esc(x.title)}">${uiIcon("pencil")}</span>`;
    const editControl = a.querySelector(".pin-edit");
    const editItem = e => { e.preventDefault(); e.stopPropagation(); openEditModal(this.manager.findById(x.id)); };
    editControl.addEventListener("click", editItem);
    editControl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") editItem(e); });

    if (isF(x)) a.onclick = e => { e.preventDefault(); this.toggleFolderMenu(this.manager.findById(x.id) || x, a); };
    else { a.target = "_blank"; a.rel = "noopener"; }

    a.oncontextmenu = e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, x); };

    a.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", x.id); e.dataTransfer.effectAllowed = "move"; a.classList.add("dragging"); });
    a.addEventListener("dragend", () => { a.classList.remove("dragging"); document.querySelectorAll(".drop-target").forEach(n => n.classList.remove("drop-target")); });
    a.addEventListener("dragover", e => { e.preventDefault(); a.classList.add("drop-target"); });
    a.addEventListener("dragleave", () => a.classList.remove("drop-target"));
    a.addEventListener("drop", e => {
      e.preventDefault(); a.classList.remove("drop-target");
      let src = this.manager.findById(e.dataTransfer.getData("text/plain"));
      if (!src || src.id === x.id) return;
      if (isF(x)) {
        this.manager.update(src.id, { parent: x.id, bar: false });
      } else {
        let ord = this.manager.items.filter(y => y.bar && !y.parent && y.id !== src.id).sort((a, b) => (a.order || 0) - (b.order || 0));
        let idx = ord.findIndex(y => y.id === x.id);
        ord.splice(Math.max(0, idx), 0, src);
        this.manager.batch(() => ord.forEach((y, j) => this.manager.update(y.id, { order: j, parent: "", bar: true })));
      }
      this.render();
    });
    return a;
  }

  buildRecursiveTree(parentId) {
    let items = this.manager.getKids(parentId).sort((a, b) => a.title.localeCompare(b.title));
    if (!items.length) return '<div class="muted" style="padding:6px 12px">This folder is empty</div>' + `<div class="sep"></div><button class="ctxitem" data-add="${parentId}">＋ Add bookmark</button><button class="ctxitem" data-folder="${parentId}">＋ Create subfolder</button>`;

    return items.map(x => {
      let icon = iconMarkup(x);
      if (isF(x)) {
        return `<div style="width:100%">
          <div class="popitem" data-folder-toggle="${x.id}">
            <span class="glyph">${icon}</span>
            <span class="popname">${esc(x.title)}</span>
            <span class="sub">${this.manager.getKids(x.id).length} items ▾</span>
            <button class="edit-btn" data-edit="${x.id}" title="Edit item" aria-label="Edit ${esc(x.title)}" onclick="event.stopPropagation()">${uiIcon("pencil")}</button>
          </div>
          <div class="foldernode" id="sub_${x.id}">${this.buildRecursiveTree(x.id)}</div>
        </div>`;
      } else {
        return `<div class="popitem" data-open="${x.id}">
          <span class="glyph">${icon}</span>
          <span class="popname">${esc(x.title)}</span>
          <span class="sub">${esc(host(x.url))}</span>
          <button class="edit-btn" data-edit="${x.id}" title="Edit item" aria-label="Edit ${esc(x.title)}" onclick="event.stopPropagation()">${uiIcon("pencil")}</button>
        </div>`;
      }
    }).join('') + `<div class="sep"></div><button class="ctxitem" data-add="${parentId}">＋ Add bookmark</button><button class="ctxitem" data-folder="${parentId}">＋ Create subfolder</button>`;
  }

  toggleFolderMenu(f, anchor) {
    if (this.openId === f.id) return hidePop();
    this.openId = f.id;
    let p = document.getElementById("popup"), r = anchor.getBoundingClientRect();
    p.style.left = Math.max(5, Math.min(r.left, innerWidth - 320)) + "px";
    p.style.top = Math.min(r.bottom, innerHeight - 100) + "px";
    p.innerHTML = this.buildRecursiveTree(f.id);
    p.classList.add("show");
    this.wirePopupTree();
  }

  toggleOverflow(anchor, ids) {
    let r = anchor.getBoundingClientRect(), p = document.getElementById("popup");
    this.openId = "__overflow";
    p.style.left = Math.max(5, Math.min(r.left, innerWidth - 320)) + "px";
    p.style.top = Math.min(r.bottom, innerHeight - 100) + "px";
    let arr = ids.map(id => this.manager.findById(id)).filter(Boolean);
    p.innerHTML = arr.map(x => `<div class="popitem" data-open="${x.id}"><span class="glyph">${iconMarkup(x)}</span><span class="popname">${esc(x.title)}</span><button class="edit-btn" data-edit="${x.id}" title="Edit item" aria-label="Edit ${esc(x.title)}" onclick="event.stopPropagation()">${uiIcon("pencil")}</button></div>`).join("") + '<div class="sep"></div><button class="ctxitem" data-all="1">Show all bookmarks…</button>';
    p.classList.add("show");
    this.wirePopupTree();
    p.querySelectorAll("[data-all]").forEach(b => b.onclick = showAllBookmarks);
  }

  wirePopupTree() {
    let p = document.getElementById("popup");
    p.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
      let x = this.manager.findById(b.dataset.open);
      if (x && !isF(x)) { window.open(x.url, "_blank", "noopener"); hidePop(); }
    });
    p.querySelectorAll("[data-folder-toggle]").forEach(b => {
      b.onclick = () => { let node = document.getElementById("sub_" + b.dataset.folderToggle); if (node) node.classList.toggle("open"); };
    });
    p.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditModal(this.manager.findById(b.dataset.edit)));
    p.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openEditModal(null, false, b.dataset.add));
    p.querySelectorAll("[data-folder]").forEach(b => b.onclick = () => openEditModal(null, true, b.dataset.folder));
  }
}

const b64u = bytes => { let s = btoa(String.fromCharCode(...new Uint8Array(bytes))); return s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,""); };
const unb64u = s => { s=String(s).replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); };
const randomToken = (n=32) => b64u(crypto.getRandomValues(new Uint8Array(n)));

function readShareState() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (!params.has("key") || !params.has("vault")) return null;
  try { return { key: params.get("key"), vault: params.get("vault"), config: params.has("config") ? JSON.parse(new TextDecoder().decode(unb64u(params.get("config")))) : defaultSyncConfig() }; }
  catch (e) { console.error("Invalid Lockmark link", e); return null; }
}

function defaultSyncConfig() {
  return {
    version: 1,
    provider: "supabase",
    url: "",
    publishableKey: "",
    storage: { table: "user_storage", idColumn: "id", payloadColumn: "payload", updatedAtColumn: "updated_at" },
    realtime: { enabled: true },
    readUrl: "",
    writeUrl: "",
    method: "PUT",
    headers: {}
  };
}

function setShareState(state) {
  const q = new URLSearchParams();
  q.set("config", b64u(new TextEncoder().encode(JSON.stringify(state.config))));
  q.set("vault", state.vault);
  q.set("key", state.key);
  history.replaceState(null, "", location.pathname + location.search + "#" + q.toString());
}

class LockmarkSync {
  constructor(state) {
    this.state = state;
    this.client = null;
    this.channel = null;
    this.timer = null;
    this.debounce = null;
    this.applyingRemote = false;
    this.lastRemoteAt = 0;
    this.lastCipher = "";
    this.started = false;
    this.stopped = false;
  }

  stop() {
    this.stopped = true;
    clearInterval(this.timer); this.timer = null;
    clearTimeout(this.debounce); this.debounce = null;
    if (this.channel && this.client) {
      try { const r = this.client.removeChannel(this.channel); if (r && r.catch) r.catch(() => {}); } catch {}
    }
    this.channel = null;
  }

  async cryptoKey() {
    return crypto.subtle.importKey("raw", unb64u(this.state.key), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  }

  async encrypt(value) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.cryptoKey();
    const plain = new TextEncoder().encode(JSON.stringify(value));
    const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plain);
    return JSON.stringify({ v: 1, alg: "A256GCM", iv: b64u(iv), data: b64u(cipher) });
  }

  async decrypt(envelope) {
    const e = typeof envelope === "string" ? JSON.parse(envelope) : envelope;
    if (e.v !== 1 || e.alg !== "A256GCM") throw Error("Unbekanntes Verschlüsselungsformat");
    const key = await this.cryptoKey();
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(e.iv) }, key, unb64u(e.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  status(text) {
    if (this.stopped) return;
    setSyncStatus(text);
  }

  ready() {
    const c = this.state.config;
    return c && (
      (c.provider === "supabase" && c.url && c.publishableKey) ||
      (c.provider === "rest" && c.readUrl && c.writeUrl) ||
      (c.provider === "github" && c.token && c.gistId)
    );
  }

  async start() {
    if (this.started || this.stopped) return;
    this.started = true;
    if (!this.ready()) {
      this.status("Local (Click to configure sync)");
      return;
    }
    try {
      if (this.state.config.provider === "supabase") await this.startSupabase();
      else if (this.state.config.provider === "github") await this.startGitHub();
      else if (this.state.config.provider === "rest") await this.startRest();
      else throw Error("Unbekannter Provider: " + this.state.config.provider);
    } catch(e) {
      console.error("Lockmark Sync:", e);
      this.status("Sync-Fehler (Lokaler Modus aktiv)");
    }
  }

  async startSupabase() {
    const c = this.state.config;
    if (!window.supabase?.createClient) await new Promise((resolve, reject) => {
      let old = document.querySelector('script[data-lockmark-supabase]');
      if (old) { old.addEventListener("load", resolve, { once: true }); old.addEventListener("error", () => reject(Error("Supabase-Bibliothek konnte nicht geladen werden")), { once: true }); return; }
      let sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"; sc.dataset.lockmarkSupabase = "1"; sc.onload = resolve; sc.onerror = () => reject(Error("Supabase-Bibliothek konnte nicht geladen werden")); document.head.append(sc);
    });
    if (this.stopped) return;
    if (!window.supabase?.createClient) throw Error("Supabase-JavaScript-Bibliothek ist nicht verfügbar");
    this.client = window.supabase.createClient(c.url, c.publishableKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    await this.pullSupabase();
    if (this.stopped) return;
    if (c.realtime?.enabled !== false) {
      const table = c.storage?.table || "user_storage", idCol = c.storage?.idColumn || "id";
      this.channel = this.client.channel("lockmark-" + this.state.vault).on("postgres_changes", { event: "*", schema: "public", table, filter: `${idCol}=eq.${this.state.vault}` }, payload => {
        if (payload.new?.[c.storage?.payloadColumn || "payload"]) this.applyRemote(payload.new[c.storage?.payloadColumn || "payload"]).catch(e => console.error(e));
      }).subscribe(status => { if (status === "SUBSCRIBED") this.status("Synced (Live)"); else if (status === "CHANNEL_ERROR") this.status("Connected (Polling/No Realtime)"); });
    } else this.status("Synced");
  }

  async pullSupabase() {
    const c = this.state.config, s = c.storage || {}, table = s.table || "user_storage", idCol = s.idColumn || "id", payloadCol = s.payloadColumn || "payload", updatedCol = s.updatedAtColumn || "updated_at";
    const { data, error } = await this.client.from(table).select(`${idCol},${payloadCol},${updatedCol}`).eq(idCol, this.state.vault).maybeSingle();
    if (error) throw Error(error.message);
    if (data && data[payloadCol]) await this.applyRemote(data[payloadCol]); else await this.uploadCurrent();
  }

  async startGitHub() {
    const c = this.state.config;
    c.readUrl = `https://api.github.com/gists/${c.gistId}`;
    c.writeUrl = `https://api.github.com/gists/${c.gistId}`;
    c.method = "PATCH";
    c.headers = { "Authorization": `Bearer ${c.token}`, "Accept": "application/vnd.github+json" };
    await this.pullGitHub();
    if (this.stopped) return;
    const ms = Math.max(10000, Number(c.pollIntervalMs) || 15000);
    this.timer = setInterval(() => this.pullGitHub().catch(e => console.error(e)), ms);
    this.status("Synced (GitHub)");
  }

  async pullGitHub() {
    if (this.stopped) return;
    const c = this.state.config;
    const res = await fetch(c.readUrl, { headers: c.headers });
    if (!res.ok) throw Error("GitHub API error: " + res.status);
    const gist = await res.json();
    const filename = `lockmark_${this.state.vault}.json`;
    if (gist.files && gist.files[filename]) {
      await this.applyRemote(gist.files[filename].content);
    } else {
      await this.uploadCurrent();
    }
  }

  async applyRemote(rawCipher) {
    if (this.stopped || !rawCipher) return;
    if (rawCipher === this.lastCipher) return;
    try {
      const data = await this.decrypt(rawCipher);
      if (this.stopped) return;
      if (!Array.isArray(data.items)) throw Error("Invalid synced items");
      stripLegacyIcons(data.items);
      this.lastCipher = rawCipher;
      this.lastRemoteAt = Date.now();
      this.applyingRemote = true;
      try {
        bm.items = data.items;
        repo.save(bm.items);
        toolbarUI.render();
      } finally {
        this.applyingRemote = false;
      }
      this.status("Synced");
    } catch (e) {
      console.error("Decryption/Remote apply error:", e);
    }
  }

  localChanged(items) {
    if (this.stopped || this.applyingRemote || !this.ready()) return;
    clearTimeout(this.debounce);
    this.debounce = setTimeout(() => this.uploadCurrent().catch(e => { console.error(e); this.status("Sync Upload Failed"); }), 600);
  }

  async uploadCurrent() {
    if (this.stopped || !this.ready() || this.applyingRemote) return;
    const envelope = await this.encrypt({ version: 1, updatedAt: Date.now(), items: bm.items });
    if (envelope === this.lastCipher) return;
    const now = new Date().toISOString();

    if (this.state.config.provider === "supabase") {
      const s = this.state.config.storage || {}, row = {};
      row[s.idColumn || "id"] = this.state.vault;
      row[s.payloadColumn || "payload"] = envelope;
      row[s.updatedAtColumn || "updated_at"] = now;
      const { error } = await this.client.from(s.table || "user_storage").upsert(row, { onConflict: s.idColumn || "id" });
      if (error) throw Error(error.message);
    } else if (this.state.config.provider === "github") {
      const c = this.state.config;
      const filename = `lockmark_${this.state.vault}.json`;
      const res = await fetch(c.writeUrl, {
        method: "PATCH",
        headers: c.headers,
        body: JSON.stringify({ files: { [filename]: { content: envelope } } })
      });
      if (!res.ok) throw Error("GitHub Gist update failed: " + res.status);
    } else {
      const c = this.state.config, url = (c.writeUrl || "").replaceAll("{id}", encodeURIComponent(this.state.vault));
      const headers = { "Content-Type": "application/json", ...(c.headers || {}) };
      const res = await fetch(url, { method: c.method || "PUT", headers, body: JSON.stringify({ id: this.state.vault, payload: envelope, updated_at: now }) });
      if (!res.ok) throw Error("REST server responded with HTTP " + res.status);
    }
    this.lastCipher = envelope;
    this.lastRemoteAt = Date.now();
    this.status("Synced");
  }

  async startRest() {
    await this.pullRest();
    if (this.stopped) return;
    this.status("Synced (REST Backup)");
    const ms = Math.max(5000, Number(this.state.config.pollIntervalMs) || 15000);
    this.timer = setInterval(() => this.pullRest().catch(e => console.error(e)), ms);
  }

  async pullRest() {
    if (this.stopped) return;
    const c = this.state.config, url = (c.readUrl || "").replaceAll("{id}", encodeURIComponent(this.state.vault));
    const res = await fetch(url, { headers: { ...(c.headers || {}) } });
    if (res.status === 404) return this.uploadCurrent();
    if (!res.ok) throw Error("REST server HTTP " + res.status);
    const row = await res.json();
    if (row.payload) await this.applyRemote(row.payload);
  }
}

function faviconCandidates(url) {
  try {
    const u = new URL(url);
    if (u.protocol !== "http:" && u.protocol !== "https:") return [];
    const own = [u.origin + "/favicon.ico", u.origin + "/apple-touch-icon.png"];
    if (!prefs.externalFavicons) return own;
    return [`https://www.google.com/s2/favicons?domain=${encodeURIComponent(u.hostname)}&sz=32`, ...own];
  } catch { return []; }
}

async function convertUrlToDataUrl(srcUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const size = 32;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, size, size);
        resolve(canvas.toDataURL("image/png"));
      } catch (err) { reject(err); }
    };
    img.onerror = () => reject(Error("Bild konnte nicht geladen werden"));
    img.src = srcUrl;
  });
}

async function getBestDataIconForUrl(pageUrl) {
  const candidates = faviconCandidates(pageUrl);
  for (const src of candidates) {
    try {
      const dataUrl = await convertUrlToDataUrl(src);
      if (dataUrl && dataUrl.startsWith("data:")) {
        return dataUrl;
      }
    } catch (e) {}
  }
  return null;
}

function iconMarkup(x) {
  if (!x) return globeIcon();
  const img = src => `<img data-custom-icon="1" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;

  if (x.iconUrl) return img(x.iconUrl);
  if (x.glyph) return esc(x.glyph);
  if (isF(x)) return folderIcon();
  
  const list = faviconCandidates(x.url);
  if (list.length) return `<img data-favicon="${esc(list.join(" "))}" data-favicon-step="0" src="${esc(list[0])}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
  return globeIcon();
}

function folderIcon() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>'; }

document.addEventListener("error", event => {
  const img = event.target;
  if (!(img instanceof HTMLImageElement)) return;
  if (img.dataset.favicon) {
    const list = img.dataset.favicon.split(" ");
    const step = Number(img.dataset.faviconStep || 0) + 1;
    if (step < list.length) { img.dataset.faviconStep = String(step); img.src = list[step]; return; }

    if (holder) holder.innerHTML = globeIcon();
    return;
  }
  if (img.dataset.customIcon) { const holder = img.closest(".glyph"); if (holder) holder.innerHTML = globeIcon(); return; }
}, true);

function blobToIconDataUrl(blob, size = 32) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth || size, h = img.naturalHeight || size;
        const s = Math.min(size / w, size / h);
        const dw = Math.max(1, Math.round(w * s)), dh = Math.max(1, Math.round(h * s));
        const c = document.createElement("canvas");
        c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, (size - dw) / 2, (size - dh) / 2, dw, dh);
        resolve(c.toDataURL("image/png"));
      } catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(Error("Image could not be read")); };
    img.src = url;
  });
}

function isDescendant(candidateId, ancestorId) {
  let current = bm.findById(candidateId), seen = new Set();
  while (current && current.parent && !seen.has(current.parent)) {
    if (current.parent === ancestorId) return true;
    seen.add(current.parent);
    current = bm.findById(current.parent);
  }
  return false;
}

  modal(`<h3>Import browser bookmarks</h3><p>Choose an HTML or JSON export from your browser.</p><label class="field"><span>File</span><input id="file" type="file" accept=".html,.htm,.json"></label><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn" id="go">Import</button></div>`);
  document.getElementById("cancel").onclick = closeModal;
  document.getElementById("go").onclick = async () => {
    let file = document.getElementById("file").files[0]; if (!file) return toast("Please choose a file");
    try {
      let text = await file.text(), incoming = [];
      if (/\.json$/i.test(file.name)) {
        let j = JSON.parse(text); incoming = (j.items || j);
      } else {
        let doc = new DOMParser().parseFromString(text, "text/html");
        function norm(s) { return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, ""); }
        function parse(dl, parent = "", toolbar = false) {
          for (let dt of dl.children) {
            if (dt.tagName !== "DT") continue;
            let h = [...dt.children].find(n => n.tagName === "H3"), a = [...dt.children].find(n => n.tagName === "A"), sub = [...dt.children].find(n => n.tagName === "DL");
            if (h) {
              let name = h.textContent.trim(), key = norm(name), isToolbar = ["bookmarkstoolbar","lesezeichensymbolleiste","bookmarksbar","personaltoolbar"].includes(key);
              if (isToolbar) { if (sub) parse(sub, parent, true); }
              else {
                let id = crypto.randomUUID();
                incoming.push({ id, title: name, type: "folder", url: "", parent, glyph: "📁", bar: !!toolbar && !parent, order: incoming.length });
                if (sub) parse(sub, id, false);
              }
            } else if (a && /^https?:/.test(a.href)) {
              incoming.push({ id: crypto.randomUUID(), title: a.textContent.trim() || host(a.href), type: "link", url: a.href, parent, glyph: "", bar: !!toolbar && !parent, order: incoming.length });
            }
          }
        }
        let root = doc.querySelector("body > dl") || doc.querySelector("dl"); if (root) parse(root, "", false);
      }
      if (!incoming.length) throw Error("No bookmarks found");
      
      // OPTIONAL: Konvertiere importierte Items direkt in Data-URLs
      for (let item of incoming) {
        if (item.type === "link" && item.url && !item.iconUrl) {
          const generatedDataUrl = await getBestDataIconForUrl(item.url);
          if (generatedDataUrl) {
            item.iconUrl = generatedDataUrl;
            item.iconAuto = true;
          }
        }
      }

      bm.importData(incoming);
      closeModal();
      toolbarUI.render();
      toast(incoming.length + " bookmarks imported");
    } catch (e) { toast("Import failed: " + e.message); }
  };
}

document.getElementById("bar").addEventListener("contextmenu", e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY); });
document.addEventListener("click", e => { if (!e.target.closest("#ctx") && !e.target.closest("#bar")) document.getElementById("ctx").classList.remove("show"); if (!e.target.closest("#popup") && !e.target.closest("#bar")) hidePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { hidePop(); document.getElementById("ctx").classList.remove("show"); closeModal(); } });

(() => {
  let pending = false;
  new ResizeObserver(() => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; toolbarUI.render(); });
  }).observe(document.getElementById("bar"));
})();

renderAppStatus();
toolbarUI.render();
window.lockmarkSync.start().catch(e=>console.error(e));

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", async () => {
    try {
      await navigator.serviceWorker.register("./sw.js");
      appStatus.offline = true;
      renderAppStatus();
    } catch (err) {
      console.error("Service Worker error:", err);
    }
  });
}
</script>
</body>
