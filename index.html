<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f5;color:#211d1b;font:13px Arial,sans-serif}.bar{height:7vh;min-height:43px;max-height:62px;display:grid;grid-template-rows:1fr 1fr;overflow:hidden;padding:1px 5px;border-bottom:1px solid #e5d8d2}.row{display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap;width:100%;min-width:0}.pin{max-width:none;min-width:0;flex:0 1 auto}.pin .label{max-width:clamp(54px,10vw,160px)}.pin{height:100%;max-width:155px;display:flex;align-items:center;gap:5px;padding:1px 5px;color:#091a9c;text-decoration:none;font-weight:bold;border:1px solid transparent;border-radius:4px;flex-shrink:0}.pin:hover,.pin.folder{background:#eef2ff}.glyph{width:18px;height:18px;display:inline-grid;place-items:center;border:1px solid #ffb74d;border-radius:4px;background:#fff;flex-shrink:0}.bar{width:100vw;max-width:100vw;grid-template-columns:minmax(0,1fr);padding-left:5px;padding-right:5px}.row{width:100%;min-width:0;gap:2px}.pin{max-width:none;flex:0 0 auto;flex-shrink:0}.pin .label{max-width:none;overflow:hidden;text-overflow:ellipsis}.popup,.ctx{display:none;position:fixed;background:#fff;z-index:5;border:1px solid #d9ced9;box-shadow:0 5px 20px #241b2928}.popup.show,.ctx.show{display:block}.popup{min-width:300px;max-width:min(480px,96vw);max-height:75vh;overflow:auto;border-radius:8px;padding:8px}.popitem{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:5px 8px;border:0;border-radius:5px;background:#fff;text-align:left;color:#16132d;font-size:13px;cursor:pointer}.popitem:hover,.ctx button:hover,.treeitem:hover{background:#f0edff}.popname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:10px;color:#8c8495}.ctx{min-width:210px;padding:5px;border-radius:8px}.ctx button{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:5px;padding:8px 10px;cursor:pointer;font:12px Arial}.sep{height:1px;background:#eee5eb;margin:4px}.bg{display:none;position:fixed;inset:0;background:#21171088;align-items:center;justify-content:center;padding:12px;z-index:10}.bg.show{display:flex}.modal{background:#fffdfa;border-radius:10px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}.field{display:block;margin:10px 0}.field span{display:block;font-weight:bold;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:7px;border:1px solid #e7d8d1;border-radius:5px}.btn{background:white;border:1px solid #e7d8d1;border-radius:5px;padding:5px 8px;cursor:pointer}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}.toast{display:none;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:8px 12px;border-radius:6px;z-index:20}.toast.show{display:block}.tree{max-height:55vh;overflow:auto}.pin[draggable="true"]{cursor:grab}.pin.dragging{opacity:.35}.pin.drop-target{outline:2px dashed #5965d8}.overflowpin{background:#f4f0eb!important;color:#4a3b32!important}.treeitem{display:flex;align-items:center;gap:7px;padding:5px;border-radius:4px}.treeitem button{border:0;background:transparent;text-align:left;cursor:pointer}.treeitem .tree-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:#827989;font-size:12px}
.foldernode{margin-left:12px;border-left:1px dashed #d9ced9;padding-left:6px;display:none}.foldernode.open{display:block}

<body>
<section class="bar" id="bar" aria-label="Lesezeichen-Symbolleiste">
  <div class="row" id="r1"></div>
  <div class="row" id="r2"></div>
</section>
<div class="popup" id="popup"></div>
<div class="ctx" id="ctx"></div>
<div class="bg" id="bg"><section class="modal" id="modal"></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="app-status" style="position:fixed;right:8px;bottom:8px;z-index:4;font:11px Arial,sans-serif;color:#756b68;background:#fffdfa;border:1px solid #eaded8;border-radius:99px;padding:4px 8px;opacity:.92" title="App-Status">Lockmark · lokal</div>

<script>
// --- 1. REPOSITORY SCHICHT (Speicher, Migration & Versionierung) ---
class BookmarkRepository {
  constructor(storageKey = "lockmark.data") {
    this.storageKey = storageKey;
  }

  load() {
    try {
      // 1. Prüfen, ob im neuen Speicherort bereits Daten liegen
      let raw = localStorage.getItem(this.storageKey);
      if (raw) {
        let data = JSON.parse(raw);
        let items = data.items || data;
        if (items.length > 0 && !items.some(x => x.bar)) {
          items.forEach(x => { if (!x.parent) x.bar = true; });
        }
        return { version: data.version || 1, items };
      }

      // 2. Fallback: Nach alten Schlüsseln suchen und migrieren
      const oldKeys = [
        "lockmark.compact.v7.data",
        "lockmark.compact.v6.data"
      ];

      let oldRaw = null;
      for (let key of oldKeys) {
        oldRaw = localStorage.getItem(key);
        if (oldRaw) break;
      }

      if (oldRaw) {
        let oldData = JSON.parse(oldRaw);
        let items = oldData.items || oldData;

        if (items.length > 0 && !items.some(x => x.bar)) {
          items.forEach(x => { if (!x.parent) x.bar = true; });
        }

        // Direkt unter dem neuen Clean-Key speichern
        this.save(items);
        return { version: 1, items };
      }

      return { version: 1, items: [] };
    } catch (e) {
      console.error("Ladefehler:", e);
      return { version: 1, items: [] };
    }
  }

  save(items) {
    let payload = {
      version: 1,
      updatedAt: Date.now(),
      items: items
    };
    localStorage.setItem(this.storageKey, JSON.stringify(payload));
  }
}

// --- 2. GESCHÄFTSLOGIK SCHICHT (Manager) ---
class BookmarkManager {
  constructor(repo) {
    this.repo = repo;
    let stored = this.repo.load();
    this.version = stored.version;
    this.items = stored.items;
  }

  persist() {
    this.repo.save(this.items);
    if (window.lockmarkSync) window.lockmarkSync.localChanged(this.items);
  }

  getKids(parentId = "") {
    return this.items.filter(x => (x.parent || "") === (parentId || ""));
  }

  findById(id) {
    return this.items.find(x => x.id === id);
  }

  add(itemData) {
    const now = Date.now();
    const newItem = {
      id: crypto.randomUUID(),
      createdAt: now,
      updatedAt: now,
      order: now,
      ...itemData
    };
    this.items.push(newItem);
    this.persist();
    return newItem;
  }

  update(id, itemData) {
    let item = this.findById(id);
    if (!item) return;
    Object.assign(item, itemData, { updatedAt: Date.now() });
    this.persist();
  }

  remove(id) {
    let target = this.findById(id);
    if (!target) return;
    this.items.forEach(y => { if (y.parent === id) y.parent = target.parent || ""; });
    this.items = this.items.filter(y => y.id !== id);
    this.persist();
  }

  exportData() {
    return JSON.stringify({ version: this.version, updatedAt: Date.now(), items: this.items }, null, 2);
  }

  importData(incomingItems) {
    let now = Date.now();
    let remap = new Map();
    incomingItems.filter(x => x.type === "folder").forEach(x => remap.set(x.id, crypto.randomUUID()));
    
    incomingItems.forEach(x => {
      let oldId = x.id;
      let isF = x.type === "folder";
      x.id = isF ? (remap.get(oldId) || crypto.randomUUID()) : crypto.randomUUID();
      x.parent = x.parent ? (remap.get(x.parent) || "") : "";
      x.bar = !x.parent && !!x.bar;
      x.createdAt = x.createdAt || now;
      x.updatedAt = now;
      this.items.push(x);
    });
    this.persist();
  }
}

// --- 3. UI SCHICHT (Kompakte Symbolleiste) ---
class ToolbarUI {
  constructor(manager) {
    this.manager = manager;
    this.openId = null;
  }

  render() {
    const pins = this.manager.items.filter(x => x.bar && !x.parent).sort((a, b) => (a.order || 0) - (b.order || 0));
    const rows = [document.getElementById("r1"), document.getElementById("r2")];
    rows.forEach(r => r.innerHTML = "");
    const available = document.getElementById("bar").clientWidth - 12;
    
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;left:-10000px;top:0;display:flex;gap:2px;white-space:nowrap;visibility:hidden;font:13px Arial,sans-serif";
    pins.forEach(x => {
      const a = document.createElement("a");
      a.className = "pin";
      a.style.cssText = "display:flex;align-items:center;gap:5px;padding:1px 5px;flex-shrink:0;max-width:none";
      a.innerHTML = `<span class="glyph">${x.iconUrl?`<img src="${esc(x.iconUrl)}" style="width:16px;height:16px;object-fit:contain" alt="">`:esc(sym(x))}</span><span class="label">${esc(x.title)}${isF(x)?" ▾":""}</span>`;
      probe.append(a);
    });
    document.body.append(probe);
    let widths = [...probe.children].map(n => n.getBoundingClientRect().width + 2); probe.remove();
    
    let chosen = [[], []], used = [0, 0], overflow = [], row = 0;
    pins.forEach((x, i) => {
      let w = widths[i];
      if (row === 0 && used[0] + w <= available) { chosen[0].push(x); used[0] += w; }
      else { row = 1; if (used[1] + w <= available - (pins.length > i + 1 ? 34 : 0)) { chosen[1].push(x); used[1] += w; } else overflow.push(x); }
    });
    if (overflow.length) {
      while (chosen[1].length && used[1] + 34 > available) {
        let x = chosen[1].pop(); let idx = pins.indexOf(x); used[1] -= widths[idx]; overflow.unshift(x);
      }
    }
    
    chosen.forEach((arr, i) => arr.forEach(x => rows[i].append(this.createPinElement(x))));
    if (overflow.length) {
      let a = document.createElement("a"); a.href = "#"; a.className = "pin overflowpin"; a.style.flex = "0 0 auto";
      a.innerHTML = '<span class="label">≫</span>'; a.title = "Weitere Lesezeichen";
      a.onclick = e => { e.preventDefault(); this.toggleOverflow(a, overflow.map(x => x.id)); };
      rows[1].append(a);
    }
  }

  createPinElement(x) {
    let a = document.createElement("a");
    a.className = "pin" + (isF(x) ? " folder" : "");
    a.href = isF(x) ? "#" : x.url; a.draggable = true; a.dataset.id = x.id;
    a.innerHTML = `<span class="glyph">${x.iconUrl?`<img src="${esc(x.iconUrl)}" style="width:16px;height:16px;object-fit:contain" alt="">`:esc(sym(x))}</span><span class="label">${esc(x.title)}${isF(x)?" ▾":""}</span>`;
    
    if (isF(x)) a.onclick = e => { e.preventDefault(); this.toggleFolderMenu(x, a); };
    else { a.target = "_blank"; a.rel = "noopener"; }
    
    a.oncontextmenu = e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, x); };
    
    a.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", x.id); e.dataTransfer.effectAllowed = "move"; a.classList.add("dragging"); });
    a.addEventListener("dragend", () => { a.classList.remove("dragging"); document.querySelectorAll(".drop-target").forEach(n => n.classList.remove("drop-target")); });
    a.addEventListener("dragover", e => { e.preventDefault(); a.classList.add("drop-target"); });
    a.addEventListener("dragleave", () => a.classList.remove("drop-target"));
    a.addEventListener("drop", e => {
      e.preventDefault(); a.classList.remove("drop-target");
      let src = this.manager.findById(e.dataTransfer.getData("text/plain"));
      if (!src || src.id === x.id) return;
      if (isF(x)) {
        this.manager.update(src.id, { parent: x.id, bar: false });
      } else {
        let ord = this.manager.items.filter(y => y.bar && !y.parent && y.id !== src.id).sort((a, b) => (a.order || 0) - (b.order || 0));
        let idx = ord.findIndex(y => y.id === x.id);
        ord.splice(Math.max(0, idx), 0, src);
        ord.forEach((y, j) => this.manager.update(y.id, { order: j, parent: "", bar: true }));
      }
      this.render();
    });
    return a;
  }

  buildRecursiveTree(parentId) {
    let items = this.manager.getKids(parentId).sort((a, b) => a.title.localeCompare(b.title));
    if (!items.length) return '<div class="muted" style="padding:6px 12px">Ordner ist leer</div>';
    
    return items.map(x => {
      let icon = x.iconUrl ? `<img src="${esc(x.iconUrl)}" style="width:16px;height:16px;object-fit:contain" alt="">` : esc(sym(x));
      if (isF(x)) {
        return `<div style="width:100%">
          <div class="popitem" data-folder-toggle="${x.id}">
            <span class="glyph">${icon}</span>
            <span class="popname">${esc(x.title)}</span>
            <span class="sub">${this.manager.getKids(x.id).length} Einträge ▾</span>
            <button class="btn" data-edit="${x.id}" onclick="event.stopPropagation()">⋯</button>
          </div>
          <div class="foldernode" id="sub_${x.id}">${this.buildRecursiveTree(x.id)}</div>
        </div>`;
      } else {
        return `<div class="popitem" data-open="${x.id}">
          <span class="glyph">${icon}</span>
          <span class="popname">${esc(x.title)}</span>
          <span class="sub">${esc(host(x.url))}</span>
          <button class="btn" data-edit="${x.id}" onclick="event.stopPropagation()">⋯</button>
        </div>`;
      }
    }).join('') + `<div class="sep"></div><button class="ctxitem" data-add="${parentId}">＋ Lesezeichen hinzufügen</button><button class="ctxitem" data-folder="${parentId}">＋ Unterordner erstellen</button>`;
  }

  toggleFolderMenu(f, anchor) {
    if (this.openId === f.id) return hidePop();
    this.openId = f.id;
    let p = document.getElementById("popup"), r = anchor.getBoundingClientRect();
    p.style.left = Math.max(5, Math.min(r.left, innerWidth - 320)) + "px";
    p.style.top = Math.min(r.bottom, innerHeight - 100) + "px";
    p.innerHTML = this.buildRecursiveTree(f.id);
    p.classList.add("show");
    this.wirePopupTree();
  }

  toggleOverflow(anchor, ids) {
    let r = anchor.getBoundingClientRect(), p = document.getElementById("popup");
    this.openId = "__overflow";
    p.style.left = Math.max(5, Math.min(r.left, innerWidth - 320)) + "px";
    p.style.top = Math.min(r.bottom, innerHeight - 100) + "px";
    let arr = ids.map(id => this.manager.findById(id)).filter(Boolean);
    p.innerHTML = arr.map(x => `<div class="popitem" data-open="${x.id}"><span class="glyph">${esc(sym(x))}</span><span class="popname">${esc(x.title)}</span><button class="btn" data-edit="${x.id}" onclick="event.stopPropagation()">⋯</button></div>`).join("") + '<div class="sep"></div><button class="ctxitem" data-all="1">Alle Lesezeichen anzeigen…</button>';
    p.classList.add("show");
    this.wirePopupTree();
    p.querySelectorAll("[data-all]").forEach(b => b.onclick = showAllBookmarks);
  }

  wirePopupTree() {
    let p = document.getElementById("popup");
    p.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
      let x = this.manager.findById(b.dataset.open);
      if (x && !isF(x)) { window.open(x.url, "_blank", "noopener"); hidePop(); }
    });
    p.querySelectorAll("[data-folder-toggle]").forEach(b => {
      b.onclick = () => { let node = document.getElementById("sub_" + b.dataset.folderToggle); if (node) node.classList.toggle("open"); };
    });
    p.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditModal(this.manager.findById(b.dataset.edit)));
    p.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openEditModal(null, false, b.dataset.add));
    p.querySelectorAll("[data-folder]").forEach(b => b.onclick = () => openEditModal(null, true, b.dataset.folder));
  }
}

// --- 4. SYNCHRONISIERUNG: URL-Schlüssel, E2EE und austauschbare Backends ---
const b64u = bytes => { let s = btoa(String.fromCharCode(...new Uint8Array(bytes))); return s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,""); };
const unb64u = s => { s=String(s).replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); };
const randomToken = (n=32) => b64u(crypto.getRandomValues(new Uint8Array(n)));
function readShareState() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (!params.has("key") || !params.has("vault")) return null;
  try { return { key: params.get("key"), vault: params.get("vault"), config: params.has("config") ? JSON.parse(new TextDecoder().decode(unb64u(params.get("config")))) : defaultSyncConfig() }; }
  catch (e) { console.error("Ungültiger Lockmark-Link",e); return null; }
}
function defaultSyncConfig() {
  return { version:1, provider:"supabase", url:"", publishableKey:"", storage:{table:"user_storage",idColumn:"id",payloadColumn:"payload",updatedAtColumn:"updated_at"}, realtime:{enabled:true}, note:"Nur einen öffentlichen publishable/anon-Key verwenden, niemals service_role." };
}
function setShareState(state) {
  const q = new URLSearchParams(); q.set("config",b64u(new TextEncoder().encode(JSON.stringify(state.config)))); q.set("vault",state.vault); q.set("key",state.key);
  history.replaceState(null,"",location.pathname+location.search+"#"+q.toString());
}
class LockmarkSync {
  constructor(state) { this.state=state; this.client=null; this.channel=null; this.timer=null; this.debounce=null; this.applyingRemote=false; this.lastRemoteAt=0; this.lastCipher=""; this.started=false; }
  async cryptoKey() { return crypto.subtle.importKey("raw",unb64u(this.state.key),{name:"AES-GCM"},false,["encrypt","decrypt"]); }
  async encrypt(value) {
    const iv=crypto.getRandomValues(new Uint8Array(12)); const key=await this.cryptoKey();
    const plain=new TextEncoder().encode(JSON.stringify(value)); const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain);
    return JSON.stringify({v:1,alg:"A256GCM",iv:b64u(iv),data:b64u(cipher)});
  }
  async decrypt(envelope) {
    const e=typeof envelope==="string"?JSON.parse(envelope):envelope;
    if(e.v!==1||e.alg!=="A256GCM") throw Error("Unbekanntes Verschlüsselungsformat");
    const key=await this.cryptoKey(); const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64u(e.iv)},key,unb64u(e.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  status(text) { const el=document.getElementById("app-status"); if(el) el.textContent="Lockmark · "+text; }
  ready() { const c=this.state.config; return c && ((c.provider==="supabase" && c.url && c.publishableKey) || (c.provider==="rest" && c.readUrl && c.writeUrl)); }
  async start() {
    if(this.started) return; this.started=true;
    if(!this.ready()) { this.status("lokal · Sync konfigurieren"); return; }
    try {
      if(this.state.config.provider==="supabase") await this.startSupabase();
      else if(this.state.config.provider==="rest") await this.startRest();
      else throw Error("Unbekannter Provider: "+this.state.config.provider);
    } catch(e) { console.error("Lockmark Sync:",e); this.status("Sync-Fehler"); toast("Sync konnte nicht starten: "+e.message); }
  }
  async startSupabase() {
    const c=this.state.config;
    if(!window.supabase?.createClient) await new Promise((resolve,reject)=>{
      let old=document.querySelector('script[data-lockmark-supabase]');
      if(old) { old.addEventListener("load",resolve,{once:true}); old.addEventListener("error",()=>reject(Error("Supabase-Bibliothek konnte nicht geladen werden")),{once:true}); return; }
      let sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"; sc.dataset.lockmarkSupabase="1"; sc.onload=resolve; sc.onerror=()=>reject(Error("Supabase-Bibliothek konnte nicht geladen werden")); document.head.append(sc);
    });
    if(!window.supabase?.createClient) throw Error("Supabase-JavaScript-Bibliothek ist nicht verfügbar");
    this.client=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    await this.pullSupabase();
    if(c.realtime?.enabled!==false) {
      const table=c.storage?.table||"user_storage", idCol=c.storage?.idColumn||"id";
      this.channel=this.client.channel("lockmark-"+this.state.vault).on("postgres_changes",{event:"*",schema:"public",table,filter:`${idCol}=eq.${this.state.vault}`},payload=>{
        if(payload.new?.[c.storage?.payloadColumn||"payload"]) this.applyRemote(payload.new).catch(e=>console.error(e));
      }).subscribe(status=>{ if(status==="SUBSCRIBED") this.status("synchronisiert · live"); else if(status==="CHANNEL_ERROR") this.status("Realtime nicht verfügbar"); });
    } else this.status("verbunden");
  }
  async pullSupabase() {
    const c=this.state.config, s=c.storage||{}, table=s.table||"user_storage", idCol=s.idColumn||"id", payloadCol=s.payloadColumn||"payload", updatedCol=s.updatedAtColumn||"updated_at";
    const {data,error}=await this.client.from(table).select(`${idCol},${payloadCol},${updatedCol}`).eq(idCol,this.state.vault).maybeSingle();
    if(error) throw Error(error.message+" (Tabelle/RLS prüfen)");
    if(data) await this.applyRemote(data); else await this.uploadCurrent();
  }
  async applyRemote(row) {
    const c=this.state.config, s=c.storage||{}, payloadCol=s.payloadColumn||"payload", updatedCol=s.updatedAtColumn||"updated_at";
    const stamp=Date.parse(row[updatedCol]||"")||Date.now(); if(stamp<this.lastRemoteAt) return;
    const raw=row[payloadCol]; if(!raw) return;
    if(raw===this.lastCipher) { this.lastRemoteAt=Math.max(this.lastRemoteAt,stamp); return; }
    const data=await this.decrypt(raw);
    if(!Array.isArray(data.items)) throw Error("Synchronisierte Daten sind ungültig");
    this.lastRemoteAt=stamp; this.lastCipher=raw; this.applyingRemote=true;
    try { bm.items=data.items; repo.save(bm.items); toolbarUI.render(); }
    finally { this.applyingRemote=false; }
    this.status("synchronisiert");
  }
  localChanged(items) {
    if(this.applyingRemote || !this.ready()) return;
    clearTimeout(this.debounce); this.debounce=setTimeout(()=>this.uploadCurrent().catch(e=>{console.error(e);this.status("Upload fehlgeschlagen");}),500);
  }
  async uploadCurrent() {
    if(!this.ready() || this.applyingRemote) return;
    const envelope=await this.encrypt({version:1,updatedAt:Date.now(),items:bm.items});
    if(envelope===this.lastCipher) return;
    const now=new Date().toISOString();
    if(this.state.config.provider==="supabase") {
      const s=this.state.config.storage||{}, row={}; row[s.idColumn||"id"]=this.state.vault; row[s.payloadColumn||"payload"]=envelope; row[s.updatedAtColumn||"updated_at"]=now;
      const {error}=await this.client.from(s.table||"user_storage").upsert(row,{onConflict:s.idColumn||"id"}); if(error) throw Error(error.message+" (RLS/Berechtigungen prüfen)");
    } else {
      const c=this.state.config, url=(c.writeUrl||"").replaceAll("{id}",encodeURIComponent(this.state.vault));
      const headers={"Content-Type":"application/json",...(c.headers||{})};
      const res=await fetch(url,{method:c.method||"PUT",headers,body:JSON.stringify({id:this.state.vault,payload:envelope,updated_at:now})});
      if(!res.ok) throw Error("REST-Server antwortete mit HTTP "+res.status);
    }
    this.lastCipher=envelope; this.lastRemoteAt=Date.now(); this.status("synchronisiert");
  }
  async startRest() {
    await this.pullRest(); this.status("verbunden · REST");
    // Generischer REST-Adapter hat ohne serverseitige Events einen konfigurierbaren Polling-Fallback.
    const ms=Math.max(5000,Number(this.state.config.pollIntervalMs)||15000);
    this.timer=setInterval(()=>this.pullRest().catch(e=>{console.error(e);this.status("Sync-Fehler");}),ms);
  }
  async pullRest() {
    const c=this.state.config, url=(c.readUrl||"").replaceAll("{id}",encodeURIComponent(this.state.vault));
    const res=await fetch(url,{headers:{...(c.headers||{})}}); if(res.status===404) return this.uploadCurrent(); if(!res.ok) throw Error("REST-Server antwortete mit HTTP "+res.status);
    const row=await res.json(); if(row.payload) await this.applyRemote(row);
  }
}
const parsedShare = readShareState();
const initialShare = parsedShare || {key:randomToken(32),vault:randomToken(32),config:defaultSyncConfig()};
if (!parsedShare) setShareState(initialShare);
window.lockmarkSync=new LockmarkSync(initialShare);
function openSyncSettings() {
  const st=window.lockmarkSync.state;
  const sample=JSON.stringify(st.config,null,2);
  modal(`<h3>Synchronisierung & Teilen</h3><p class="muted">Der Verschlüsselungsschlüssel wird automatisch erzeugt und bleibt im URL-Fragment. Der Server erhält nur verschlüsselte Lesezeichen. Wer den vollständigen Link besitzt, kann auf diesen gemeinsamen Bestand zugreifen.</p><label class="field"><span>Backend-Konfiguration (JSON)</span><textarea id="sync-json" rows="13" style="width:100%;font:12px ui-monospace,monospace;padding:8px;border:1px solid #e7d8d1;border-radius:5px;resize:vertical">${esc(sample)}</textarea></label><p class="muted">Supabase: Projekt-URL und öffentlicher publishable/anon-Key. Niemals service_role verwenden. Tabelle benötigt die konfigurierten Spalten; für das Standardschema siehe Anleitung in der ZIP. Provider „rest“ verwendet readUrl/writeUrl mit {id}; der REST-Server muss JSON mit payload liefern und PUT/POST zum Schreiben unterstützen.</p><div class="actions" style="justify-content:space-between"><button class="btn" id="new-key">Neuen Schlüssel erzeugen</button><span><button class="btn" id="sync-cancel">Schließen</button> <button class="btn" id="sync-save">Konfiguration speichern</button></span></div><div class="actions"><button class="btn" id="copy-link">🔗 Teilen-Link kopieren</button><button class="btn" id="copy-config">JSON kopieren</button></div>`);
  document.getElementById("sync-cancel").onclick=closeModal;
  document.getElementById("sync-save").onclick=async()=>{
    try { const cfg=JSON.parse(document.getElementById("sync-json").value); if(!cfg||typeof cfg!=="object"||!cfg.provider) throw Error("provider fehlt");
      st.config=cfg; setShareState(st); closeModal(); window.lockmarkSync=new LockmarkSync(st); await window.lockmarkSync.start(); toast("Konfiguration gespeichert");
    } catch(e) { toast("JSON/Sync-Fehler: "+e.message); }
  };
  document.getElementById("new-key").onclick=()=>{if(!confirm("Neuer Schlüssel erstellt einen neuen, getrennten Lesezeichenbestand. Bestehende Sync-Daten bleiben auf dem Server."))return; st.key=randomToken(32);st.vault=randomToken(32);setShareState(st);window.lockmarkSync=new LockmarkSync(st);document.getElementById("sync-json").value=JSON.stringify(st.config,null,2);toast("Neuer Schlüssel und neuer Speicher erstellt");};
  document.getElementById("copy-link").onclick=()=>{setShareState(st);navigator.clipboard?.writeText(location.href).then(()=>toast("Teilen-Link kopiert")).catch(()=>toast("Link kopieren nicht möglich – URL aus der Adresszeile kopieren"));};
  document.getElementById("copy-config").onclick=()=>navigator.clipboard?.writeText(document.getElementById("sync-json").value).then(()=>toast("JSON kopiert"));
}

// --- INITIALISIERUNG & GLOBALE HILFSFUNKTIONEN ---
const repo = new BookmarkRepository("lockmark.data");
const bm = new BookmarkManager(repo);
const toolbarUI = new ToolbarUI(bm);

const esc = s => String(s ?? "" ).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),
      host = u => { try { return new URL(u).hostname.replace(/^www\./,"") } catch { return "" } },
      isF = x => !!x && x.type === "folder",
      sym = x => x ? (x.glyph || (isF(x) ? "📁" : host(x.url)[0] || "↗")) : "↗";

function isDescendant(candidateId, ancestorId) {
  let current = bm.findById(candidateId), seen = new Set();
  while (current && current.parent && !seen.has(current.parent)) {
    if (current.parent === ancestorId) return true;
    seen.add(current.parent);
    current = bm.findById(current.parent);
  }
  return false;
}
function toast(s) { let t = document.getElementById("toast"); t.textContent = s; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
function hidePop() { document.getElementById("popup").classList.remove("show"); toolbarUI.openId = null; }
function closeModal() { document.getElementById("bg").classList.remove("show"); }
function modal(s) { document.getElementById("modal").innerHTML = s; document.getElementById("bg").classList.add("show"); }

function showContextMenu(x, y, item = null) {
  let c = document.getElementById("ctx");
  c.innerHTML = `<button data-act="link">＋ Neues Lesezeichen…</button><button data-act="folder">📁 Neuen Ordner…</button><div class="sep"></div><button data-act="all">Alle Lesezeichen anzeigen…</button><button data-act="sync">🔗 Synchronisierung / Teilen…</button><button data-act="import">Lesezeichen importieren…</button><button data-act="export">Lesezeichen exportieren…</button>${item?'<div class="sep"></div><button data-act="edit">Eintrag bearbeiten…</button><button data-act="remove">Aus Leiste entfernen</button>':""}`;
  c.style.left = Math.min(x, innerWidth - 220) + "px";
  c.style.top = Math.min(y, innerHeight - 210) + "px";
  c.classList.add("show");
  c.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    c.classList.remove("show"); let act = b.dataset.act;
    if (act === "link") openEditModal();
    if (act === "folder") openEditModal(null, true);
    if (act === "import") importFile();
    if (act === "export") exportFile();
    if (act === "all") showAllBookmarks();
    if (act === "sync") openSyncSettings();
    if (act === "edit") openEditModal(item);
    if (act === "remove") { bm.update(item.id, { bar: false }); toolbarUI.render(); }
  });
}

function openEditModal(x = null, asFolder = false, parentOverride = "") {
  let f = asFolder || isF(x), pdef = parentOverride || x?.parent || "",
      opts = '<option value="">Lesezeichen-Symbolleiste</option>' + bm.items.filter(isF).map(o => `<option value="${o.id}" ${o.id === pdef ? "selected" : ""}>${esc(o.title)}</option>`).join("");
  
  modal(`<h3>${x ? "Eintrag bearbeiten" : f ? "Neuer Ordner" : "Neues Lesezeichen"}</h3><form id="form"><label class="field"><span>Name</span><input name="title" required value="${esc(x?.title || "")}"></label>${f ? "" : `<label class="field"><span>URL</span><input name="url" type="url" required placeholder="https://…" value="${esc(x?.url || "")}"></label>`}<label class="field"><span>Speicherort</span><select name="parent">${opts}</select></label><label class="field"><span>Eigenes Symbol (Emoji oder Text)</span><input name="glyph" value="${esc(x?.glyph || "")}" placeholder="z. B. 📁 oder ⭐"></label><label class="field"><span>Eigenes Icon (Bild-URL, optional)</span><input name="iconUrl" type="url" placeholder="https://…/icon.png" value="${esc(x?.iconUrl || "")}"></label><label><input name="bar" type="checkbox" ${x?.bar || (!x && !pdef) ? "checked" : ""}> In Symbolleiste anzeigen</label><div class="actions">${x ? '<button type="button" class="btn" id="del">Löschen</button>' : ""}<button type="button" class="btn" id="cancel">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form>`);
  
  document.getElementById("cancel").onclick = closeModal;
  if (x) document.getElementById("del").onclick = () => { if (confirm("Eintrag löschen? Untereinträge werden in den Elternordner verschoben.")) { bm.remove(x.id); hidePop(); closeModal(); toolbarUI.render(); } };
  
  let form = document.getElementById("form");
  let urlInput = form.querySelector('[name="url"]'), titleInput = form.querySelector('[name="title"]');
  if (urlInput && titleInput) {
    urlInput.addEventListener("input", () => {
      if (!titleInput.dataset.manual) {
        try { titleInput.value = new URL(urlInput.value).hostname.replace(/^www\./, "").split(".")[0].replace(/[-_]/g, " ").replace(/\b\w/g, c => c.toUpperCase()); } catch { titleInput.value = ""; }
      }
    });
    titleInput.addEventListener("input", () => titleInput.dataset.manual = "1");
  }

  form.onsubmit = e => {
    e.preventDefault();
    let fd = new FormData(e.target), parent = String(fd.get("parent") || ""), url = f ? "" : String(fd.get("url") || "").trim();
    if (x && (parent === x.id || (f && parent && isDescendant(parent, x.id)))) return toast("Ungültiger Speicherort: Ordner-Schleife verhindert");
    if (!f) { try { if (!["http:", "https:"].includes(new URL(url).protocol)) throw 0; } catch { return toast("Ungültige URL"); } }
    
    let v = {
      title: String(fd.get("title")).trim(),
      url,
      type: f ? "folder" : "link",
      parent,
      glyph: String(fd.get("glyph")).trim(),
      iconUrl: String(fd.get("iconUrl") || "").trim(),
      bar: fd.has("bar") && !parent
    };
    
    if (x) bm.update(x.id, v);
    else bm.add(v);
    
    closeModal(); toolbarUI.render();
  };
}

function showAllBookmarks() {
  function tree(parent = "", depth = 0) {
    return bm.getKids(parent).sort((a, b) => a.title.localeCompare(b.title)).map(x => `<div class="treeitem" style="padding-left:${8 + depth * 17}px"><span>${esc(sym(x))}</span><button class="tree-title" data-tree="${x.id}">${esc(x.title)}</button><span class="sub">${isF(x) ? bm.getKids(x.id).length + " Einträge" : esc(host(x.url))}</span><button class="btn" data-edit="${x.id}">⋯</button></div>${isF(x) ? tree(x.id, depth + 1) : ""}`).join("");
  }
  modal(`<h3>Alle Lesezeichen</h3><p class="muted">Ordner und Lesezeichen aus allen Bereichen.</p><div class="tree">${tree()}</div><div class="actions"><button class="btn" id="closeall">Schließen</button></div>`);
  document.getElementById("closeall").onclick = closeModal;
  document.getElementById("modal").querySelectorAll("[data-tree]").forEach(b => b.onclick = () => {
    let x = bm.findById(b.dataset.tree);
    if (isF(x)) { closeModal(); let anchor = [...document.querySelectorAll(".pin")].find(a => a.textContent.includes(x.title)); if (anchor) toolbarUI.toggleFolderMenu(x, anchor); else toast("Dieser Ordner liegt nicht direkt in der Symbolleiste."); }
    else if (x) window.open(x.url, "_blank", "noopener");
  });
  document.getElementById("modal").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditModal(bm.findById(b.dataset.edit)));
}

function download(d, n, t) {
  let a = document.createElement("a"), u = URL.createObjectURL(new Blob([d], { type: t }));
  a.href = u; a.download = n; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}
function exportFile() { download(bm.exportData(), "lockmark-bookmarks.json", "application/json"); }

function importFile() {
  modal(`<h3>Browser-Lesezeichen importieren</h3><p>Wähle den HTML- oder JSON-Export deines Browsers.</p><label class="field"><span>Datei</span><input id="file" type="file" accept=".html,.htm,.json"></label><div class="actions"><button class="btn" id="cancel">Abbrechen</button><button class="btn" id="go">Importieren</button></div>`);
  document.getElementById("cancel").onclick = closeModal;
  document.getElementById("go").onclick = async () => {
    let file = document.getElementById("file").files[0]; if (!file) return toast("Bitte Datei auswählen");
    try {
      let text = await file.text(), incoming = [];
      if (/\.json$/i.test(file.name)) {
        let j = JSON.parse(text); incoming = (j.items || j);
      } else {
        let doc = new DOMParser().parseFromString(text, "text/html");
        function norm(s) { return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, ""); }
        function parse(dl, parent = "", toolbar = false) {
          for (let dt of dl.children) {
            if (dt.tagName !== "DT") continue;
            let h = [...dt.children].find(n => n.tagName === "H3"), a = [...dt.children].find(n => n.tagName === "A"), sub = [...dt.children].find(n => n.tagName === "DL");
            if (h) {
              let name = h.textContent.trim(), key = norm(name), isToolbar = ["bookmarkstoolbar","lesezeichensymbolleiste","bookmarksbar","personaltoolbar"].includes(key);
              if (isToolbar) { if (sub) parse(sub, parent, true); }
              else {
                let id = crypto.randomUUID();
                incoming.push({ id, title: name, type: "folder", url: "", parent, glyph: "📁", bar: !!toolbar && !parent, order: incoming.length });
                if (sub) parse(sub, id, false);
              }
            } else if (a && /^https?:/.test(a.href)) {
              incoming.push({ id: crypto.randomUUID(), title: a.textContent.trim() || host(a.href), type: "link", url: a.href, parent, glyph: "", bar: !!toolbar && !parent, order: incoming.length });
            }
          }
        }
        let root = doc.querySelector("body > dl") || doc.querySelector("dl"); if (root) parse(root, "", false);
      }
      if (!incoming.length) throw Error("Keine Lesezeichen gefunden");
      bm.importData(incoming);
      closeModal(); toolbarUI.render(); toast(incoming.length + " Lesezeichen importiert");
    } catch (e) { toast("Import fehlgeschlagen: " + e.message); }
  };
}

document.getElementById("bar").addEventListener("contextmenu", e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY); });
document.addEventListener("click", e => { if (!e.target.closest("#ctx") && !e.target.closest("#bar")) document.getElementById("ctx").classList.remove("show"); if (!e.target.closest("#popup") && !e.target.closest("#bar")) hidePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { hidePop(); document.getElementById("ctx").classList.remove("show"); closeModal(); } });

// App starten
toolbarUI.render();
window.lockmarkSync.start().catch(e=>console.error(e));
if (!initialShare.config.url && initialShare.config.provider === "supabase" && !initialShare.config.publishableKey) { setTimeout(()=>{ openSyncSettings(); }, 350); }

// Progressive Web App: Service Worker benötigt HTTPS oder localhost.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", async () => {
    try {
      await navigator.serviceWorker.register("./sw.js");
      const status = document.getElementById("app-status");
      if (status) status.textContent = "Lockmark · offlinebereit";
    } catch (err) {
      console.error("Service Worker konnte nicht registriert werden:", err);
      const status = document.getElementById("app-status");
      if (status) status.textContent = "Lockmark · Offline-Cache nicht aktiv";
    }
  });
} else {
  const status = document.getElementById("app-status");
  if (status) status.textContent = "Lockmark · lokal (PWA via localhost/HTTPS)";
}
</script>
